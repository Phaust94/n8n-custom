name: Build and Push Docker Image

on:
  push:
    branches: [ "dev", "main" ] # Triggers on every push to the main branch
  workflow_dispatch:      # Allows you to run this manually from the Actions tab

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # This will be "username/repo-name"

# Cancel superseded runs on the same branch instead of queueing them
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # buildx is required by build-push-action and enables gha layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Uses a PAT (secrets.CR_PAT) when present, otherwise the workflow token.
      # GITHUB_TOKEN only works if this repo has write access to the package:
      #   Package settings -> Manage Actions access -> add <owner>/<repo> = Write
      # and repo Settings -> Actions -> General -> Workflow permissions = Read and write.
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT || secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
